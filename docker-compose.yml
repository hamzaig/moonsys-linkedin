services:
  moonsys-linkdin:
    build: .
    ports:
      - "127.0.0.1:${PORT:-3456}:3000"
    volumes:
      # Persist SQLite database outside the container
      - ./data:/data
    env_file:
      - .env.local
    environment:
      # Runtime — always set by compose, do not put in .env.local
      - NODE_ENV=production
      - MOONSYS_DB_PATH=/data/moonsys-linkdin.db

      # --- copy the block below into .env.local and fill in values ---
      #
      # Public URL of the app (used by NextAuth for redirects)
      # NEXTAUTH_URL=
      #
      # Random secret for NextAuth session signing
      # Generate with: openssl rand -base64 32
      # NEXTAUTH_SECRET=
      #
      # Password to log in to the MoonSys LinkedIn UI
      # AUTH_PASSWORD=
      #
      # Set to "false" to show the browser during automation (debug only)
      # HEADLESS=true

    restart: unless-stopped
    # Caps MoonSys LinkedIn's CPU so a busy runner can't starve other containers on a
    # small box. Raise/remove this if you have cores to spare.
    deploy:
      resources:
        limits:
          cpus: "1.5"
