name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      NEXTAUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Prepare temporary build credentials
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const { randomBytes } = require("node:crypto");
          for (const key of ["NEXTAUTH_SECRET", "INTERNAL_API_SECRET", "AUTH_PASSWORD"]) {
            fs.appendFileSync(process.env.GITHUB_ENV, `${key}=${randomBytes(32).toString("hex")}\n`);
          }
          NODE
      - run: npm run build
        env:
          MOONSYS_DB_PATH: ${{ runner.temp }}/moonsys-ci.db
